# gitleaks.toml — extends defaults, adds project-specific rules for Transcribe.
# Loaded by .pre-commit-config.yaml gitleaks hook.
#
# Default gitleaks rules already cover AWS / Stripe / GitHub / GCP / Slack / OpenAI / etc.
# The rules below add the secrets THIS PROJECT specifically handles.

[extend]
useDefault = true

[[rules]]
id = "huggingface-token"
description = "Hugging Face access token (hf_...)"
regex = '''hf_[A-Za-z0-9]{34,}'''
tags = ["huggingface", "token"]

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret-key key (sb_secret_...)"
regex = '''sb_secret_[A-Za-z0-9_-]{30,}'''
tags = ["supabase", "secret"]

[[rules]]
id = "supabase-publishable-key"
description = "Supabase publishable key (sb_publishable_...) — flag in case it lands in an unexpected file"
regex = '''sb_publishable_[A-Za-z0-9_-]{30,}'''
tags = ["supabase", "publishable"]

[[rules]]
id = "supabase-legacy-jwt"
description = "Legacy Supabase service-role / anon key (3-segment JWT starting with eyJ...)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["jwt", "supabase"]

[[rules]]
id = "supabase-project-url"
description = "Supabase project URL (catches *.supabase.co references in committed configs)"
regex = '''https?://[a-z0-9]{20}\.supabase\.co'''
tags = ["supabase", "url"]

# ── Phase 8: Pairing + WebRTC transport server-only env vars ──────────────────
# These four vars hold long-lived secrets (API tokens, JWT signing secrets).
# The patterns below catch accidental assignment of real values in committed files.

[[rules]]
id = "phase8-cloudflare-turn-token"
description = "Cloudflare Calls TURN API token (Phase 8 — server-only)"
regex = '''CLOUDFLARE_CALLS_TURN_API_TOKEN\s*=\s*["']?[A-Za-z0-9_\-]{20,}'''
tags = ["cloudflare", "turn", "token"]

[[rules]]
id = "phase8-supabase-realtime-jwt-secret"
description = "Supabase Realtime JWT signing secret (Phase 8 — server-only, ≥32 char base64)"
regex = '''SUPABASE_REALTIME_JWT_SECRET\s*=\s*["']?[A-Za-z0-9+/=]{32,}'''
tags = ["supabase", "jwt", "secret"]

[[rules]]
id = "phase8-upstash-redis-rest-url"
description = "Upstash Redis REST URL (Phase 8 — server-only, https://*.upstash.io)"
regex = '''UPSTASH_REDIS_REST_URL\s*=\s*["']?https://[A-Za-z0-9_.-]+\.upstash\.io'''
tags = ["upstash", "redis", "url"]

[[rules]]
id = "phase8-upstash-redis-rest-token"
description = "Upstash Redis REST token (Phase 8 — server-only, ≥32 char token)"
regex = '''UPSTASH_REDIS_REST_TOKEN\s*=\s*["']?[A-Za-z0-9_\-]{32,}'''
tags = ["upstash", "redis", "token"]

[allowlist]
description = "Allow placeholders in .env.example and the rules file itself"
paths = [
  '''\.env\.example$''',
  '''gitleaks\.toml$''',
]
