[project]
name = "transcribe-backend"
version = "0.1.0"
description = "FastAPI backend for the Transcribe app — runs whisper.cpp + pyannote on the dev's GPU host"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "pydantic-settings>=2.14.0",
    # Phase 2 will add: pyannote.audio, supabase-py, slowapi, sse-starlette,
    # tus-server (or chosen TUS lib), pyjwt[crypto], jiwer, psutil
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
    "httpx>=0.28",  # ASGI test client + Phase 2 outbound HTTP
    "ruff>=0.15.12",
]

[tool.uv]
# Pin Python 3.11 specifically — uv will download it if missing.
python = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["models/", ".venv/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert statements in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: tests that require a Vulkan-capable GPU (skipped in CI)",
]
